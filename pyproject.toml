[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_post"
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env, and
# requires.features_manual (dependencies invisible to static analysis).
[tool.splent.contract]
description = "Blog posts with categories (public list/detail + admin CRUD)"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/admin/posts", "/admin/posts/<int:post_id>/delete", "/admin/posts/<int:post_id>/edit", "/admin/posts/new", "/blog", "/blog/category/<slug>"]
blueprints = []
models     = ["Category", "Post"]
commands   = ["hello"]
hooks      = ["home.section", "layout.authenticated_sidebar"]
services   = ["PostService"]
signals    = []
translations = ["en", "es"]
docker     = []

[tool.splent.contract.requires]
features = []
features_optional = ["media"]
env_vars = ["POST_NAV_LABEL", "POST_PAGE_SIZE", "POST_PERMALINK"]
signals  = []

[tool.splent.contract.extensible]
services  = ["PostService"]
templates = ["post/admin/form.html", "post/admin/list.html", "post/detail.html", "post/home_latest.html", "post/index.html", "post/list.html"]
models    = ["Category", "Post"]
hooks     = ["home.section", "layout.authenticated_sidebar", "post.comments"]
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
[tool.splent.config]
# The shape of a post URL. Dates come from the publication moment and
# %postname% from the slug. It is read for years after it is written, so a
# site replacing an older one sets this to whatever that one served.
POST_PERMALINK = "/%Y/%m/%d/%postname%"

# Posts per page on the public blog index and category archives.
POST_PAGE_SIZE = 10

# Label of the feature's entry in the public main navigation. The URL stays
# /blog either way; a product may prefer "News" or a translated word.
POST_NAV_LABEL = "Blog"
